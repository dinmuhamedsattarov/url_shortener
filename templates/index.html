{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <form method="post">
            {% csrf_token %}
            <input type="url" name="original_url" placeholder="Enter your URL" required autocomplete="off">
            <button type="submit">Shorten</button>
        </form>

        {% if short_url_link %}
            <div class="short-link">
                Short URL: <a href="{{ short_url_link }}" target="_blank">{{ short_url_link }}</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
